name: Tag release on version bump

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version change
        id: version_change
        shell: bash
        run: |
          set -euo pipefail

          old_version=$(git show "${{ github.event.pull_request.base.sha }}:CDMLoader.toc" | grep -E '^## Version:' | head -n1 | sed 's/^## Version: //')
          new_version=$(grep -E '^## Version:' CDMLoader.toc | head -n1 | sed 's/^## Version: //')

          echo "old_version=$old_version" >> "$GITHUB_OUTPUT"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

          if [ "$old_version" != "$new_version" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.version_change.outputs.version_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version_change.outputs.new_version }}"
          tag="v${version}"

          if git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
